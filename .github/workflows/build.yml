name: Build AKU OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common xorriso mtools gcc-multilib binutils

      - name: Build kernel
        run: |
          gcc -m32 -ffreestanding -fno-pie -fno-stack-protector -fno-asynchronous-unwind-tables -nostdlib -nostartfiles -nodefaultlibs -Wall -Wextra -O2 -c kernel.c -o kernel.o
          as --32 boot.s -o boot.o
          ld -m elf_i386 -T linker.ld -o aku.bin boot.o kernel.o

      - name: Verify Multiboot
        run: grub-file --is-x86-multiboot aku.bin

      - name: Build ISO
        run: |
          rm -rf iso aku-os.iso
          mkdir -p iso/boot/grub
          cp aku.bin iso/boot/aku.bin
          cp grub.cfg iso/boot/grub/grub.cfg
          grub-mkrescue -o aku-os.iso iso
          test -s aku-os.iso
          file aku-os.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: aku-os
          path: aku-os.iso
          if-no-files-found: error
          retention-days: 30
